spring:
  application:
    name: apptracer
  config:
    # Variables locales partagées avec docker-compose (fichier .env à la racine du dépôt)
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:apptracer}
    username: ${POSTGRES_USER:apptracer}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  autoconfigure:
    # Pas d'utilisateur en mémoire généré par défaut : l'authentification passe par le JWT
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8080

springdoc:
  # L'API répond en JSON : sans cela le contrat déclare */* et le client généré reçoit des Blob
  default-produces-media-type: application/json

app:
  bootstrap:
    admin:
      # RG-03-16 : compte ADMIN initial, créé au démarrage seulement si aucun ADMIN n'existe
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      first-name: ${ADMIN_FIRST_NAME:}
      last-name: ${ADMIN_LAST_NAME:}
  demo:
    # Outil de développement : manager, dev et QA de démonstration créés au démarrage si défini
    password: ${DEMO_PASSWORD:}
  security:
    jwt:
      # RG-03-06 : JWT_SECRET est obligatoire (au moins 32 octets), sans valeur par défaut
      secret: ${JWT_SECRET:}
      access-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-ttl: ${JWT_REFRESH_TTL:7d}
