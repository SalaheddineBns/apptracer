<div class="flex flex-col gap-6">
  <div class="flex items-center justify-between gap-4">
    <h1 class="text-2xl font-semibold text-color">Équipes</h1>
    <p-button type="button" label="Nouvelle équipe" (onClick)="openCreate()" data-cy="btn-nouvelle-equipe" />
  </div>

  <section class="bg-surface-0 dark:bg-surface-900 rounded-xl p-6">
    @if (store.error(); as message) {
      <app-error-state [message]="message" (retry)="store.load()" />
    } @else if (!store.loaded()) {
      <app-loading-state [rows]="6" />
    } @else if (store.items().length === 0) {
      <app-empty-state message="Aucune équipe à afficher." icon="pi pi-users">
        <p-button type="button" label="Nouvelle équipe" (onClick)="openCreate()" data-cy="btn-nouvelle-equipe-vide" />
      </app-empty-state>
    } @else {
      <p-table [value]="store.items()" [loading]="store.loading()" [scrollable]="true" dataKey="id" class="text-sm" data-cy="table-equipes">
        <ng-template #header>
          <tr>
            <th pFrozenColumn scope="col" class="max-sm:w-40 max-sm:min-w-40 max-sm:max-w-40 max-sm:wrap-anywhere">Nom</th>
            <th scope="col">Manager</th>
            <th scope="col">Membres</th>
          </tr>
        </ng-template>
        <ng-template #body let-team>
          <tr [attr.data-cy]="'ligne-equipe-' + team.id">
            <td pFrozenColumn class="max-sm:w-40 max-sm:min-w-40 max-sm:max-w-40 max-sm:wrap-anywhere" [attr.data-cy]="'nom-equipe-' + team.id">{{ team.name }}</td>
            <td [attr.data-cy]="'manager-equipe-' + team.id">{{ fullName(team.manager) }}</td>
            <td class="tabular-nums" [attr.data-cy]="'membres-equipe-' + team.id">{{ memberCountLabel(team.memberCount) }}</td>
          </tr>
        </ng-template>
      </p-table>
    }
  </section>
</div>

<app-team-dialog [(visible)]="dialogVisible" (saved)="onSaved($event)" />
