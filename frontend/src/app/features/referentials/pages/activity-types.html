<div class="flex flex-col gap-6">
  <div class="flex items-center justify-between gap-4">
    <h1 class="text-2xl font-semibold text-color">Types d'activité</h1>
    <p-button type="button" label="Nouveau type" (onClick)="openCreate()" data-cy="btn-nouveau-type" />
  </div>

  <section class="bg-surface-0 dark:bg-surface-900 rounded-xl p-6">
    @if (store.error(); as message) {
      <app-error-state [message]="message" (retry)="store.load()" />
    } @else if (!store.loaded()) {
      <app-loading-state [rows]="6" />
    } @else if (store.items().length === 0) {
      <app-empty-state message="Aucun type d'activité à afficher.">
        <p-button type="button" label="Nouveau type" (onClick)="openCreate()" data-cy="btn-nouveau-type-vide" />
      </app-empty-state>
    } @else {
      <p-table
        [value]="store.items()"
        [loading]="store.loading()"
        [scrollable]="true"
        dataKey="id"
        class="text-sm"
        data-cy="table-types-activite"
      >
        <ng-template #header>
          <tr>
            <th pFrozenColumn scope="col">Code</th>
            <th scope="col">Libellé</th>
            <th scope="col">Étiquette</th>
            <th scope="col">Projet requis</th>
            <th scope="col">Statut</th>
            <th scope="col">Actions</th>
          </tr>
        </ng-template>
        <ng-template #body let-type>
          <tr [attr.data-cy]="'ligne-type-' + type.id">
            <td pFrozenColumn>{{ type.code }}</td>
            <td>{{ type.label }}</td>
            <td><app-activity-type-tag [label]="type.label" [color]="type.color" [code]="type.code" /></td>
            <td [attr.data-cy]="'projet-requis-type-' + type.id">{{ type.projectRequired ? 'Oui' : 'Non' }}</td>
            <td>
              <p-tag
                [value]="type.active ? 'Actif' : 'Inactif'"
                [severity]="type.active ? 'success' : 'secondary'"
                [attr.data-cy]="'statut-type-' + type.id"
              />
            </td>
            <td class="whitespace-nowrap">
              <p-button
                type="button"
                label="Modifier"
                [text]="true"
                size="small"
                severity="secondary"
                [ariaLabel]="'Modifier le type ' + type.label"
                (onClick)="openEdit(type)"
                [attr.data-cy]="'btn-modifier-type-' + type.id"
              />
              @if (type.active) {
                <p-button
                  type="button"
                  label="Désactiver"
                  [text]="true"
                  size="small"
                  severity="secondary"
                  [ariaLabel]="'Désactiver le type ' + type.label"
                  (onClick)="confirmDeactivate(type)"
                  [attr.data-cy]="'btn-desactiver-type-' + type.id"
                />
              } @else {
                <p-button
                  type="button"
                  label="Réactiver"
                  [text]="true"
                  size="small"
                  severity="secondary"
                  [ariaLabel]="'Réactiver le type ' + type.label"
                  (onClick)="reactivate(type)"
                  [attr.data-cy]="'btn-reactiver-type-' + type.id"
                />
              }
            </td>
          </tr>
        </ng-template>
      </p-table>
    }
  </section>
</div>

<app-activity-type-dialog [(visible)]="dialogVisible" [type]="editing()" (saved)="onSaved($event)" (conflict)="store.load()" />
