<div class="flex flex-col gap-6">
  <h1 class="text-2xl font-semibold text-color">{{ 'changePassword.title' | t }}</h1>

  <section class="bg-surface-0 dark:bg-surface-900 rounded-xl p-6 w-full max-w-lg">
    <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()" novalidate data-cy="form-mot-de-passe">
      <app-password-field
        [control]="form.controls.currentPassword"
        inputId="current-password"
        [label]="'changePassword.current' | t"
        [subject]="'changePassword.currentSubject' | t"
        autocomplete="current-password"
        fieldCy="champ-ancien-mot-de-passe"
        toggleCy="btn-afficher-ancien-mot-de-passe"
        [messages]="currentMessages"
      />
      <app-password-field
        [control]="form.controls.newPassword"
        inputId="new-password"
        [label]="'changePassword.new' | t"
        [subject]="'changePassword.newSubject' | t"
        autocomplete="new-password"
        fieldCy="champ-nouveau-mot-de-passe"
        toggleCy="btn-afficher-nouveau-mot-de-passe"
        [hint]="'password.hint' | t"
        [messages]="newMessages"
      />
      <app-password-field
        [control]="form.controls.confirmation"
        inputId="confirm-password"
        [label]="'changePassword.confirmation' | t"
        [subject]="'changePassword.confirmationSubject' | t"
        autocomplete="new-password"
        fieldCy="champ-confirmation-mot-de-passe"
        toggleCy="btn-afficher-confirmation-mot-de-passe"
        [messages]="confirmationMessages"
      />

      <div class="flex justify-end">
        <p-button type="submit" [label]="'common.save' | t" [loading]="submitting()" data-cy="btn-enregistrer" />
      </div>
    </form>
  </section>
</div>
