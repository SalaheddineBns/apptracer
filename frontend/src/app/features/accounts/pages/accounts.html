<div class="flex flex-col gap-6">
  <h1 class="text-2xl font-semibold text-color">Comptes</h1>

  <section class="bg-surface-0 dark:bg-surface-900 rounded-xl p-6">
    @if (store.error(); as message) {
      <app-error-state [message]="message" (retry)="store.load()" />
    } @else if (!store.loaded()) {
      <app-loading-state [rows]="6" />
    } @else if (store.total() === 0) {
      <app-empty-state message="Aucun compte à afficher." />
    } @else {
        <p-table
          [value]="store.users()"
          [lazy]="true"
          [lazyLoadOnInit]="false"
          (onLazyLoad)="onLazyLoad($event)"
          [paginator]="true"
          [rows]="store.size()"
          [first]="first()"
          [totalRecords]="store.total()"
          [rowsPerPageOptions]="rowsPerPage"
          [loading]="store.loading()"
          [scrollable]="true"
          [sortField]="store.sortField()"
          [sortOrder]="store.sortOrder()"
          dataKey="id"
          data-cy="table-comptes"
        >
          <ng-template #header>
            <tr>
              <th pSortableColumn="lastName" scope="col">Nom <p-sort-icon field="lastName" /></th>
              <th pSortableColumn="email" scope="col">E-mail <p-sort-icon field="email" /></th>
              <th pSortableColumn="role" scope="col">Rôle <p-sort-icon field="role" /></th>
              <th pSortableColumn="active" scope="col">Statut <p-sort-icon field="active" /></th>
              <th scope="col">Actions</th>
            </tr>
          </ng-template>
          <ng-template #body let-user>
            <tr [attr.data-cy]="'ligne-compte-' + user.id">
              <td>
                {{ fullName(user) }}
                @if (isSelf(user)) {
                  <span class="text-xs text-muted-color" data-cy="indicateur-vous">(vous)</span>
                }
              </td>
              <td>{{ user.email }}</td>
              <td><p-tag [value]="roleLabel(user.role)" [severity]="roleSeverity(user.role)" /></td>
              <td>
                <p-tag
                  [value]="user.active ? 'Actif' : 'Inactif'"
                  [severity]="user.active ? 'success' : 'secondary'"
                  [attr.data-cy]="'statut-compte-' + user.id"
                />
              </td>
              <td>
                @if (user.active) {
                  @if (!isSelf(user)) {
                    <p-button
                      type="button"
                      label="Désactiver"
                      [text]="true"
                      size="small"
                      severity="secondary"
                      [ariaLabel]="'Désactiver le compte de ' + fullName(user)"
                      (onClick)="confirmDeactivate(user)"
                      [attr.data-cy]="'btn-desactiver-' + user.id"
                    />
                  }
                } @else {
                  <p-button
                    type="button"
                    label="Réactiver"
                    [text]="true"
                    size="small"
                    severity="secondary"
                    [ariaLabel]="'Réactiver le compte de ' + fullName(user)"
                    (onClick)="reactivate(user)"
                    [attr.data-cy]="'btn-reactiver-' + user.id"
                  />
                }
              </td>
            </tr>
          </ng-template>
        </p-table>
    }
  </section>
</div>
