<p-dialog
  [header]="(isEdit() ? 'accounts.dialog.editTitle' : 'accounts.dialog.createTitle') | t"
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!submitting()"
  [closeAriaLabel]="'common.close' | t"
  [style]="{ width: '32rem', maxWidth: '95vw' }"
  (onShow)="focusFirstField(firstNameInput)"
  (onHide)="onHide()"
  data-cy="dialogue-compte"
>
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()" novalidate data-cy="form-compte">
    <div class="flex flex-col gap-2">
      <label for="account-first-name" class="text-sm font-medium text-color">{{ 'accounts.dialog.firstName' | t }} <span aria-hidden="true">*</span></label>
      <input pInputText #firstNameInput id="account-first-name" formControlName="firstName" autocomplete="off" fluid required data-cy="champ-prenom" />
      <app-field-error [control]="form.controls.firstName" [messages]="firstNameMessages" cy="erreur-champ-prenom" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="account-last-name" class="text-sm font-medium text-color">{{ 'accounts.dialog.lastName' | t }} <span aria-hidden="true">*</span></label>
      <input pInputText id="account-last-name" formControlName="lastName" autocomplete="off" fluid required data-cy="champ-nom" />
      <app-field-error [control]="form.controls.lastName" [messages]="lastNameMessages" cy="erreur-champ-nom" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="account-email" class="text-sm font-medium text-color">{{ 'common.email' | t }} <span aria-hidden="true">*</span></label>
      <input pInputText id="account-email" type="email" formControlName="email" autocomplete="off" fluid required data-cy="champ-email-compte" />
      @if (isEdit()) {
        <small class="text-xs text-muted-color">{{ 'accounts.dialog.emailImmutable' | t }}</small>
      }
      <app-field-error [control]="form.controls.email" [messages]="emailMessages" cy="erreur-champ-email-compte" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="account-role" class="text-sm font-medium text-color">{{ 'common.role' | t }} <span aria-hidden="true">*</span></label>
      <p-select
        formControlName="role"
        [options]="roleOptions()"
        optionLabel="label"
        optionValue="value"
        inputId="account-role"
        appendTo="body"
        fluid
        data-cy="champ-role"
      />
      @if (isSelf()) {
        <small class="text-xs text-muted-color">{{ 'accounts.dialog.selfRole' | t }}</small>
      }
      <app-field-error [control]="form.controls.role" [messages]="roleMessages" cy="erreur-champ-role" />
    </div>

    @if (jobTitleVisible()) {
      <div class="flex flex-col gap-2">
        <label for="account-job-title" class="text-sm font-medium text-color">{{ 'accounts.jobTitle' | t }}</label>
        <p-select
          formControlName="jobTitleCode"
          [options]="jobTitleOptions()"
          optionLabel="label"
          optionValue="value"
          inputId="account-job-title"
          [placeholder]="'accounts.dialog.jobTitlePlaceholder' | t"
          [showClear]="true"
          appendTo="body"
          fluid
          data-cy="champ-fonction"
        >
          <ng-template #item let-option>
            <span [attr.data-cy]="'option-fonction-' + option.value">{{ option.label }}</span>
          </ng-template>
        </p-select>
        <app-field-error [control]="form.controls.jobTitleCode" cy="erreur-champ-fonction" />
      </div>
    }

    @if (!isEdit()) {
      <app-password-field
        [control]="form.controls.initialPassword"
        inputId="account-initial-password"
        [label]="'accounts.dialog.initialPassword' | t"
        [subject]="'accounts.dialog.initialPasswordSubject' | t"
        autocomplete="new-password"
        fieldCy="champ-mot-de-passe-initial"
        toggleCy="btn-afficher-mot-de-passe-initial"
        [hint]="'password.hint' | t"
        [messages]="passwordMessages"
      />
    }

    <div class="flex justify-end gap-2">
      <p-button type="button" [label]="'common.cancel' | t" [text]="true" severity="secondary" [disabled]="submitting()" (onClick)="close()" data-cy="btn-annuler-dialogue" />
      <p-button type="submit" [label]="'common.save' | t" [loading]="submitting()" data-cy="btn-enregistrer" />
    </div>
  </form>
</p-dialog>
